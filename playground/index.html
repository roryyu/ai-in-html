<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-html playground · sashimi-ui + JSON spec</title>
<link rel="stylesheet" href="../vendor/sashimi-ui/default.theme.css">
<link rel="stylesheet" href="../vendor/sashimi-ui/bundle.css">
<link rel="stylesheet" href="../vendor/sashimi-ui/baseline.css">
<style>
	/* 页面自有 class 一律 ai- 前缀（契约 §2.5）；颜色只用 --sui-* 令牌，无硬编码色值（契约 §2.4）。 */
	:root { color-scheme: light dark; }
	body { margin: 0; background: var(--sui-color-surface); color: var(--sui-color-neutral-primary); font-size: 15px; }
	.ai-topbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sui-base-padding); padding: var(--sui-base-padding) calc(var(--sui-base-padding) * 2); background: var(--sui-color-highlight-secondary); border-bottom: 1px solid var(--sui-color-outline-secondary); }
	.ai-brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
	.ai-title { margin: 0; font-size: 1.05rem; color: var(--sui-color-neutral-primary); }
	.ai-sub { margin: 0; font-size: 0.78rem; color: var(--sui-color-neutral-secondary); }
	.ai-presets { display: flex; flex-wrap: wrap; gap: var(--sui-icon-gap); }
	.ai-topactions { display: flex; flex-wrap: wrap; gap: var(--sui-icon-gap); }
	.ai-split { display: grid; grid-template-columns: minmax(320px, 42%) minmax(0, 1fr); gap: var(--sui-base-padding); padding: var(--sui-base-padding) calc(var(--sui-base-padding) * 2) 64px; align-items: start; }
	.ai-pane { background: var(--sui-color-surface); border: 1px solid var(--sui-color-outline-secondary); border-radius: var(--sui-roundness-strong); padding: var(--sui-base-padding); min-width: 0; }
	.ai-pane h2 { margin: 0 0 var(--sui-base-padding); font-size: 0.95rem; color: var(--sui-color-neutral-secondary); }
	.ai-toolbar { display: flex; flex-wrap: wrap; gap: var(--sui-icon-gap); margin-bottom: var(--sui-base-padding); }
	.ai-editor { display: block; width: 100%; min-height: 460px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.55; background: var(--sui-color-highlight-secondary); color: var(--sui-color-neutral-primary); border: 1px solid var(--sui-color-outline-secondary); border-radius: var(--sui-roundness-normal); padding: var(--sui-label-gap); }
	.ai-valid { margin-top: var(--sui-base-padding); }
	.ai-valid p { margin-block: var(--sui-label-gap); }
	.ai-tabs { display: flex; flex-wrap: wrap; gap: var(--sui-label-gap); border-bottom: 1px solid var(--sui-color-outline-secondary); margin-bottom: var(--sui-base-padding); }
	.ai-pre { margin: 0; padding: var(--sui-base-padding); background: var(--sui-color-highlight-secondary); border-radius: var(--sui-roundness-normal); font-size: 12px; line-height: 1.55; max-height: 62vh; overflow: auto; }
	.ai-scroll { max-height: 62vh; overflow: auto; }
	.ai-preview > h1 { font-size: 1.8rem; margin-block: var(--sui-base-padding) var(--sui-label-gap); }
	.ai-preview > h2 { font-size: 1.3rem; margin-block: var(--sui-base-padding) var(--sui-label-gap); }
	.ai-preview > h3 { font-size: 1.05rem; margin-block: var(--sui-base-padding) var(--sui-label-gap); }
	.ai-preview p { margin-block: var(--sui-label-gap); }
	.ai-preview hr { margin-block: var(--sui-base-padding); }
	.ai-preview table { margin-block: var(--sui-label-gap); }
	.ai-hint { color: var(--sui-color-key-secondary); font-size: 0.8rem; margin: var(--sui-label-gap) 0 0; }
	@media (max-width: 960px) {
		.ai-split { grid-template-columns: minmax(0, 1fr); }
		.ai-brand { margin-right: 0; }
	}
</style>
</head>
<body>
<!-- 离线图标 sprite：runtime 渲染 Icon / Callout / Button 图标时用 <use href="#ai-icon-*"> 引用这里（契约 §3.6）。 -->
<svg style="display:none" aria-hidden="true" focusable="false">
	<symbol id="ai-icon-check" viewBox="0 0 24 24"><polyline points="4,12.5 9.5,18 20,6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
	<symbol id="ai-icon-close" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
	<symbol id="ai-icon-plus" viewBox="0 0 24 24"><path d="M12 5 L12 19 M5 12 L19 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
	<symbol id="ai-icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11 L12 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.4" r="1.3" fill="currentColor"/></symbol>
	<symbol id="ai-icon-warning" viewBox="0 0 24 24"><path d="M12 4 L21 19.5 L3 19.5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10 L12 14.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="currentColor"/></symbol>
	<symbol id="ai-icon-arrow-forward" viewBox="0 0 24 24"><path d="M4 12 L19 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M13 6 L19 12 L13 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<!-- 自测挂点：脚本在同步阶段写 data-*（契约 §7.6）；--dump-dom 抓快照时不会早于它。 -->
<div id="selftest" hidden></div>

<header class="ai-topbar">
	<div class="ai-brand">
		<h1 class="ai-title">ai-html playground</h1>
		<p class="ai-sub">左边写 JSON spec，右边看渲染 —— 零依赖、离线、class 只用 sashimi-ui 白名单。</p>
	</div>
	<div class="ai-presets" id="presets" role="group" aria-label="预设切换"></div>
	<div class="ai-topactions">
		<button class="button" type="button" id="tb-apply">应用 spec</button>
		<button class="button secondary" type="button" id="tb-copy">复制 spec</button>
	</div>
</header>

<main class="ai-split">
	<section class="ai-pane" aria-label="spec 编辑器">
		<h2>spec JSON</h2>
		<div class="ai-toolbar">
			<button class="button" type="button" id="tb-apply2">应用</button>
			<button class="button" type="button" id="tb-format">格式化</button>
			<button class="button secondary" type="button" id="tb-reset">重置为预设</button>
			<button class="button tertiary" type="button" id="tb-copy2">复制 spec</button>
			<button class="button shy" type="button" id="tb-prompt">复制系统提示</button>
		</div>
		<label class="label" for="spec">可编辑的 spec（输入后 300ms 防抖校验）</label>
		<textarea class="textarea ai-editor" id="spec" spellcheck="false" autocomplete="off" rows="26"></textarea>
		<div class="ai-valid" id="valid" aria-live="polite"></div>
		<p class="ai-hint" id="hint"></p>
	</section>

	<section class="ai-pane" aria-label="渲染结果">
		<div class="ai-tabs" id="tabs" role="tablist">
			<button class="tab-item active" type="button" data-pane="preview" role="tab" aria-selected="true">预览</button>
			<button class="tab-item" type="button" data-pane="state" role="tab" aria-selected="false">状态 JSON</button>
			<button class="tab-item" type="button" data-pane="log" role="tab" aria-selected="false">动作日志</button>
		</div>
		<div class="ai-preview ai-scroll" id="preview"></div>
		<div id="state" hidden><pre class="ai-pre" id="state-pre"></pre></div>
		<div class="ai-scroll" id="log" hidden></div>
	</section>
</main>

<!-- 经典 script（非 module），file:// 直接双击即可运行（契约 §2.1 / §7.1）。 -->
<script src="../runtime/ai-html.js"></script>
<script>

	/* ---- DOM 引用与小工具 ---- */
	var selftest = document.getElementById("selftest");
	var preview = document.getElementById("preview");
	var editor = document.getElementById("spec");
	var validBox = document.getElementById("valid");
	var hintBox = document.getElementById("hint");
	var statePre = document.getElementById("state-pre");
	var logBox = document.getElementById("log");
	var chipsBox = document.getElementById("presets");
	var ctrl = null;
	var current = "landing";
	var timer = 0;

	function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
	function cx() {
		var a = [], i;
		for (i = 0; i < arguments.length; i++) if (arguments[i]) a.push(String(arguments[i]));
		return a.join(" ");
	}
	function clone(v) { return JSON.parse(JSON.stringify(v)); }
	function flat(v) {
		return String(v === undefined || v === null ? "" : v).replace(/[\r\n\t]+/g, " ").replace(/"/g, "'").trim();
	}
	function el(tag, cls, text) {
		var n = document.createElement(tag);
		if (cls) n.className = cls;
		if (text !== undefined) n.textContent = String(text);
		return n;
	}
	function stamp(ms) {
		var d = new Date(ms), p = function (n, w) { return String(n).padStart(w || 2, "0"); };
		return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "." + p(d.getMilliseconds(), 3);
	}

	/* ---- 校验区：合法时 helper-text，非法时 callout destructive（预览永不变空白） ---- */
	function setValid(res, note) {
		validBox.replaceChildren();
		if (res.ok) {
			validBox.appendChild(el("p", "helper-text", note || "spec 合法：root、children 引用与组件类型均有效。"));
			return;
		}
		var box = el("div", "callout destructive");
		var head = el("p");
		head.appendChild(el("strong", null, "spec 有 " + res.errors.length + " 个问题，预览保持上一版"));
		box.appendChild(head);
		res.errors.forEach(function (e) { box.appendChild(el("p", null, e)); });
		validBox.appendChild(box);
	}
	function setHint(msg) { hintBox.textContent = msg ? String(msg) : ""; }

	/* ---- 右栏状态与动作日志 ---- */
	function paintState() {
		statePre.textContent = ctrl ? JSON.stringify(ctrl.getState(), null, 2) : "";
	}
	function paintLog() {
		var log = ctrl ? ctrl.getActionLog().slice().reverse() : [];
		logBox.replaceChildren();
		if (!log.length) {
			logBox.appendChild(el("p", "helper-text", "还没有动作。点击预览里的按钮，或在编辑器里改动 spec。"));
			return;
		}
		var table = el("table", "table");
		var thead = el("thead"), htr = el("tr");
		["时间", "动作", "参数", "处理"].forEach(function (t) {
			var th = el("th", null, t);
			th.setAttribute("scope", "col");
			htr.appendChild(th);
		});
		thead.appendChild(htr);
		table.appendChild(thead);
		var body = el("tbody");
		log.forEach(function (e) {
			var tr = el("tr");
			tr.appendChild(el("td", null, stamp(e.at)));
			tr.appendChild(el("td", null, e.name));
			tr.appendChild(el("td", null, JSON.stringify(e.params)));
			tr.appendChild(el("td", null, e.handled ? "已处理" : "未注册"));
			body.appendChild(tr);
		});
		table.appendChild(body);
		table.appendChild(el("caption", null, "共 " + log.length + " 条，倒序显示"));
		logBox.appendChild(table);
	}

	/* ---- 预设装载 ---- */
	function markChips() {
		var list = chipsBox.querySelectorAll("[data-preset]"), i;
		for (i = 0; i < list.length; i++) {
			list[i].className = cx("chip", list[i].getAttribute("data-preset") === current && "active");
		}
	}
	function mount(presetId) {
		var preset = PRESETS[own(PRESETS, presetId) ? presetId : "landing"];
		current = presetId;
		if (ctrl) ctrl.destroy();
		ctrl = AIHtml.render(preset.spec, preview, {
			state: clone(preset.state),
			handlers: HANDLERS,
			onAction: paintLog,
			onChange: paintState
		});
		editor.value = JSON.stringify(preset.spec, null, 2);
		markChips();
		paintState();
		paintLog();
		setValid(AIHtml.validate(preset.spec), "已载入预设「" + preset.label + "」：" + Object.keys(preset.spec.elements).length + " 个元素。");
		setHint("");
	}

	/* ---- 编辑器：解析 → 校验 → 合法才重渲染 ---- */
	function apply() {
		var spec, res;
		try { spec = JSON.parse(editor.value); }
		catch (e) {
			setValid({ ok: false, errors: ["JSON 解析失败：" + (e && e.message ? e.message : String(e))] });
			return;
		}
		res = AIHtml.validate(spec);
		if (!res.ok) { setValid(res); return; }
		ctrl.setSpec(spec);
		setValid(res, "已应用编辑中的 spec（" + Object.keys(spec.elements).length + " 个元素）。");
		paintState();
		paintLog();
	}
	function onEdit() {
		window.clearTimeout(timer);
		timer = window.setTimeout(apply, 300);
	}
	function format() {
		try { editor.value = JSON.stringify(JSON.parse(editor.value), null, 2); apply(); }
		catch (e) { setValid({ ok: false, errors: ["无法格式化：JSON 解析失败"] }); }
	}
	/* 复制：先走 execCommand，失败再退回 async clipboard；两条路都拒绝时只提示，不抛异常。 */
	function copyText(text, what) {
		var ok = false;
		try {
			var tmp = document.createElement("textarea");
			tmp.value = text;
			tmp.setAttribute("readonly", "");
			tmp.style.position = "fixed";
			tmp.style.opacity = "0";
			document.body.appendChild(tmp);
			tmp.select();
			ok = document.execCommand("copy");
			document.body.removeChild(tmp);
		} catch (e) {
			ok = false;
		}
		if (ok) { setHint(what + " 已复制到剪贴板。"); return; }
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(text).then(
				function () { setHint(what + " 已复制到剪贴板。"); },
				function () { setHint("浏览器拒绝了剪贴板访问，请手动复制：" + what); }
			);
			return;
		}
		setHint("浏览器拒绝了剪贴板访问，请手动复制：" + what);
	}

	/* ---- 动作 handler（未注册的名字 runtime 也不会抛异常，只记 handled:false） ---- */
	var HANDLERS = {
		loadPreset: function (p) { if (p && p.id) mount(p.id); },
		copySpec: function () { copyText(editor.value, "spec"); },
		copyState: function () { copyText(ctrl ? JSON.stringify(ctrl.getState(), null, 2) : "{}", "状态 JSON"); },
		announce: function (p) { setHint(p && p.text ? p.text : "已触发动作"); },
		clearForm: function (p, ctx) {
			ctx.set("/form/name", "");
			ctx.set("/form/email", "");
			ctx.set("/form/agree", false);
			ctx.set("/touched/email", false);
		},
		loadCities: function (p) { setHint("watch 触发 loadCities，地区 = " + (p && p.country ? p.country : "-")); }
	};

	/* ---- 自测辅助 ---- */
	function collectClasses(root) {
		var seen = {}, out = [], all = root.querySelectorAll("*"), i, j, raw, parts, c;
		for (i = 0; i < all.length; i++) {
			raw = all[i].className;
			if (typeof raw !== "string") continue;
			parts = raw.split(/\s+/);
			for (j = 0; j < parts.length; j++) {
				c = parts[j];
				if (!c || seen[c] || WHITELIST.indexOf(c) === -1) continue;
				seen[c] = 1;
				out.push(c);
			}
		}
		return out.sort().join(",");
	}
	function templateProbe() {
		var box = document.createElement("div"), value;
		AIHtml.render({
			root: "t",
			elements: { t: { type: "Text", props: { text: { $template: TMPL_SRC } } } }
		}, box, { state: { probe: { name: "ai-html", note: "运行时" } } });
		value = box.textContent;
		if (!value || value === TMPL_SRC || value.indexOf("${") !== -1) {
			throw new Error("$template 求值异常：" + value);
		}
		return value;
	}
	function badSpec() {
		return {
			root: "ghost",
			elements: { ghost: { type: "NotAType", props: {}, children: ["missing"] } }
		};
	}
	function measure(presetId) {
		var p = {}, btn, cs, before, after, alpha;
		p.runtime = AIHtml.version;
		p.catalog = Object.keys(AIHtml.catalog).length;
		p.preset = presetId;
		p.rendered = preview.getElementsByTagName("*").length;
		p.classes = collectClasses(preview);
		btn = preview.querySelector(".button");
		if (!btn) throw new Error("预览区内没有 .button，无法测量计算样式");
		cs = window.getComputedStyle(btn);
		p.radius = cs.borderTopLeftRadius;
		p.bg = cs.backgroundColor;
		if (p.classes.indexOf("button") === -1 || p.classes.indexOf("card") === -1) {
			throw new Error("预览区 class 集合缺少 button 或 card：" + p.classes);
		}
		/* 背景非空且非全透明：解析计算值的 alpha 通道，页面里不写任何色值字面量。 */
		alpha = /rgba?\(([^)]*)\)/.exec(p.bg);
		if (!p.bg || (alpha && Number(alpha[1].split(",")[3]) === 0)) {
			throw new Error("首个 .button 的背景色不可见：" + p.bg);
		}
		before = preview.textContent.indexOf(FLIP_TEXT) !== -1;
		ctrl.dispatch("setState", { statePath: "/ui/showTip", value: true });
		ctrl.dispatch("setState", { statePath: "/ui/probe", value: "self-test" });
		after = preview.textContent.indexOf(FLIP_TEXT) !== -1;
		p["visible-flip"] = after ? "shown" : "hidden";
		p.actions = ctrl.getActionLog().length;
		p["state-keys"] = Object.keys(ctrl.getState()).sort().join(",");
		if (before) throw new Error("自测开始时 visible 元素已可见，预设初始状态不干净");
		if (!after) throw new Error("派发 setState 之后 visible 元素仍未出现");
		if (p.actions < 2) throw new Error("自测期间动作条数不足 2");
		p.template = templateProbe();
		p["validate-bad"] = AIHtml.validate(badSpec()).ok ? "accepted" : "rejected";
		if (p["validate-bad"] === "accepted") throw new Error("故意损坏的 spec 未被 validate 拒绝");
		return p;
	}
	/* 自测属性清单（契约 §7.6）：属性名写全，读取时去掉 data- 前缀。 */
	var FLUSH_ATTRS = ["data-runtime", "data-catalog", "data-preset", "data-rendered", "data-classes", "data-radius", "data-bg", "data-state-keys", "data-actions", "data-visible-flip", "data-template", "data-validate-bad"];
	function flush(probe) {
		var i, name, key;
		for (i = 0; i < FLUSH_ATTRS.length; i++) {
			name = FLUSH_ATTRS[i];
			key = name.slice(5);
			if (probe[key] !== undefined) selftest.setAttribute(name, flat(probe[key]));
		}
		if (probe.status === "fail" && probe.error) selftest.setAttribute("data-error", flat(probe.error));
		selftest.setAttribute("data-status", probe.status);
	}

	/* ---- 右栏页签 ---- */
	function showPane(name) {
		["preview", "state", "log"].forEach(function (k) {
			var btn = document.querySelector('#tabs [data-pane="' + k + '"]');
			var node = document.getElementById(k);
			if (k === "state") node = statePre.parentNode;
			btn.className = cx("tab-item", k === name && "active");
			btn.setAttribute("aria-selected", k === name ? "true" : "false");
			node.hidden = k !== name;
		});
	}

	/* ---- 读 hash：#preset=<id> / #selftest=off（契约 §7.5） ---- */
	function readHash() {
		var parts = location.hash.replace(/^#/, "").split("&"), i, kv;
		for (i = 0; i < parts.length; i++) {
			kv = parts[i].split("=");
			if (kv[0] === "preset" && own(PRESETS, kv[1])) return kv[1];
		}
		return "landing";
	}
	function selftestOff() {
		return /(^|&)selftest=off(&|$)/.test(location.hash.replace(/^#/, ""));
	}

	/* ---- 启动：全部同步，无 setTimeout / rAF / Promise（契约 §2.3 / §7.6） ---- */
	function boot() {
		var start = readHash(), probe = null;
		ORDER.forEach(function (id) {
			var b = el("button", "chip", PRESETS[id].label);
			b.type = "button";
			b.setAttribute("data-preset", id);
			b.addEventListener("click", function () { mount(id); });
			chipsBox.appendChild(b);
		});
		document.querySelectorAll("#tabs [data-pane]").forEach(function (b) {
			b.addEventListener("click", function () { showPane(b.getAttribute("data-pane")); });
		});
		document.getElementById("tb-apply").addEventListener("click", apply);
		document.getElementById("tb-apply2").addEventListener("click", apply);
		document.getElementById("tb-format").addEventListener("click", format);
		document.getElementById("tb-reset").addEventListener("click", function () { mount(current); });
		document.getElementById("tb-copy").addEventListener("click", function () { copyText(editor.value, "spec"); });
		document.getElementById("tb-copy2").addEventListener("click", function () { copyText(editor.value, "spec"); });
		document.getElementById("tb-prompt").addEventListener("click", function () {
			copyText(AIHtml.prompt(), "AIHtml.prompt() 系统提示");
		});
		editor.addEventListener("input", onEdit);

		if (typeof AIHtml !== "object") {
			selftest.setAttribute("data-status", "fail");
			selftest.setAttribute("data-error", "window.AIHtml 未定义，runtime 脚本没有加载成功");
			return;
		}
		mount(start);
		if (selftestOff()) return;          // #selftest=off：供人浏览，不写任何 data-*
		try {
			probe = measure(start);
			probe.status = "ok";
		} catch (e) {
			probe = { status: "fail", error: e && e.message ? e.message : String(e) };
		}
		mount(start);                        // 恢复纯净的当前预设状态，界面与动作日志回到初始态
		flush(probe);                        // data-status 最后写
	}
	boot();
})();
</script>
</body>
</html>
